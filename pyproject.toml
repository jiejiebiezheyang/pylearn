[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylearn"
version = "1.0.0"
description = "Sixteen numbered, self-contained, runnable examples covering the core of Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["python", "examples", "learning", "standard-library", "teaching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.8", "ruff>=0.4"]

[tool.setuptools]
# The examples are flat scripts, not an importable package: install nothing.
py-modules = []
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
# pyflakes (F), import sorting (I) and line length (E501). The whitespace
# rules in E1/E2/E3 are intentionally left out: they fight with formatters
# and add no value for example code.
select = ["E4", "E7", "E9", "E501", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["."]
exclude = ["\\.venv", "build", "dist"]
# Non-strict on purpose: the examples show dynamic Python (getattr on a
# dynamically loaded module, Any at the boundary, duck typing). Keep every
# "turn this on" switch explicit so the relaxed choices are visible.
strict = false
warn_unused_ignores = false
warn_return_any = false
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["."]
norecursedirs = [".venv", "build", "dist", "__pycache__"]
addopts = "-ra"
